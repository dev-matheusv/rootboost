// ===== PayPal server side checkout (price enforced by the API) =====
function initPayPal(){
  if (!window.paypal) {
    document.getElementById("paypal-button-container").innerHTML =
      "<p style='color:var(--muted)'>Add your PayPal client ID to enable checkout.</p>";
    return;
  }
  paypal.Buttons({
    style:{ layout:"vertical", color:"gold", shape:"rect", label:"pay" },
    createOrder: () => fetch(CONFIG.apiBase + "/paypal/create-order", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ productKey: CONFIG.productKey, quantity: 1 })

      if (!d.id) throw new Error(d.error || "no order id");
      return d.id;
    }),
    onApprove: (data) => fetch(CONFIG.apiBase + "/paypal/capture-order", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ orderId: data.orderID })
    }).then(r => r.json()).then(() => {
      document.getElementById("thanks").style.display = "block";
      document.getElementById("paypal-button-container").style.display = "none";
    }),
    onError: () => { document.getElementById("err").style.display = "block"; }
  }).render("#paypal-button-container");
}
</script>
<!-- PayPal SDK: replace YOUR_PAYPAL_CLIENT_ID (currency must match CONFIG.currency) -->
<script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=USD" onload="initPayPal()"></script>
</body>
